[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wieso-mcp"
version = "0.3.0"
description = "Unofficial MCP server that lets an AI agent work in WISO Steuer (Windows desktop) — never submits."
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pywinauto==0.6.9", "lxml>=5", "pydantic>=2.10", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[project.scripts]
wieso-mcp = "wieso_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wieso_mcp = ["mapping.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["wiso: real-life test against the installed WISO Steuer 2026 (run with -m wiso)"]
addopts = "-m 'not wiso'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
